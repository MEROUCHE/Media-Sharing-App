spring.application.name=Media-Sharing-App
spring.profiles.active=local
spring.datasource.url=jdbc:postgresql://localhost:5432/media_sharing_db
spring.datasource.username=postgres
spring.datasource.password=your_db_password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=your-256-bit-secret-key-base64-encoded-here-change-this-in-production
jwt.expiration=86400000


tmdb.api.key=${TMDB_API_KEY}
rawg.api.key=${RAWG_API_KEY}

jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}

spring.mail.host=smtp.resend.com
spring.mail.port=465
spring.mail.username=resend
spring.mail.password=${RESEND_API_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
app.base-url=${APP_BASE_URL}